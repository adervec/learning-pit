<!doctype html>
<meta charset="utf-8">
<title>Learning Pit — self test</title>
<style>
  body { background: #06080b; color: #e9f2f8; font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p.lede { color: #8ba0b1; margin: 0 0 16px; }
  #out { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .ok { color: #5fd39a; } .fail { color: #e8735f; } .info { color: #8ba0b1; }
  #frame { width: 420px; height: 700px; border: 1px solid #22323f; border-radius: 12px; float: right; }
  #summary { font-size: 1.1rem; margin: 14px 0; }
</style>
<h1>Learning Pit — self test</h1>
<p class="lede">Drives the real app in the frame. Your own data is snapshotted and put back at the end.</p>
<iframe id="frame" src="about:blank"></iframe>
<div id="summary">running…</div>
<div id="out"></div>

<script type="module">
const out = document.getElementById('out');
const frame = document.getElementById('frame');
let pass = 0, fail = 0;

const log = (cls, msg) => out.insertAdjacentHTML('beforeend', `<div class="${cls}">${msg}</div>`);
const ok = m => { pass++; log('ok', '✓ ' + m); };
const bad = (m, extra) => { fail++; log('fail', '✗ ' + m + (extra ? ` — ${extra}` : '')); };
const check = (cond, m, extra) => cond ? ok(m) : bad(m, extra);
// setTimeout in a backgrounded tab is clamped to a crawl; a worker's timers are not.
const clock = new Worker(URL.createObjectURL(new Blob([
  'onmessage=e=>setTimeout(()=>postMessage(e.data[0]),e.data[1])'])));
let waitN = 0;
const waiters = new Map();
clock.onmessage = e => { const r = waiters.get(e.data); waiters.delete(e.data); r && r(); };
const wait = ms => new Promise(r => { waiters.set(++waitN, r); clock.postMessage([waitN, ms]); });

// The app and this page share an origin, so its storage is ours. Put it back afterwards.
const KEYS = ['pit.v1', 'pit.session', 'pit.wasSignedIn', 'pit.mockdrive'];
const backup = Object.fromEntries(KEYS.map(k => [k, localStorage.getItem(k)]));
const restore = () => KEYS.forEach(k => backup[k] === null ? localStorage.removeItem(k) : localStorage.setItem(k, backup[k]));

const doc = () => frame.contentDocument;
const $ = sel => doc().querySelector(sel);
const $$ = sel => [...doc().querySelectorAll(sel)];
const state = () => JSON.parse(localStorage.getItem('pit.v1') || '{}');
// Nothing is written until the app saves, so an untouched run has no state at all.
const profile = () => (state().profiles || {})[state().active] || { stats: {}, srs: {} };

// Wait for the thing to exist rather than for a guessed number of milliseconds — background
// tabs clamp timers, and the app's start-up does its own fetching.
async function waitFor(sel, ms = 10000) {   // generous: an automated browser under load is slower than any person
  const until = Date.now() + ms;
  while (Date.now() < until) {
    if ($(sel)) return $(sel);
    await wait(50);
  }
  throw new Error('never appeared: ' + sel);
}

async function boot() {
  KEYS.forEach(k => localStorage.removeItem(k));
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  // A cleared device asks who it is for first; every case below wants the grown-up library.
  const first = await waitFor('[data-act="setupme"], [data-act="open"]');
  if (first.dataset.act === 'setupme') { first.click(); await wait(200); }
  await waitFor('[data-act="open"]');    // modules loaded and the library drawn
}
const click = async (sel, ms = 160) => { const el = await waitFor(sel); el.click(); await wait(ms); };

try {
  // ---- 1. it starts up with the bundled modules ----
  await boot();
  const shipped = await fetch('./modules/index.json').then(r => r.json());
  const tiles = $$('[data-act="open"]');
  check(tiles.length === shipped.modules.length,
    `every bundled module loads (${tiles.length} of ${shipped.modules.length})`);
  check(!$('.warn'), 'and none of them failed to validate', $('.warn')?.textContent);
  check(!!$('.welcome'), 'a first-run explanation is shown');

  // ---- 2. a recall session records a review ----
  await click('[data-act="open"][data-id="world-capitals"]');
  check(doc().getElementById('app').className.includes('module'), 'module screen opens');
  await click('[data-game="recall"]');
  await click('[data-act="flip"]');
  const frontShown = $('.face')?.textContent.trim();
  await click('[data-g="good"]');
  check(profile().stats.reviews === 1, 'grading records exactly one review', 'got ' + profile().stats.reviews);
  check(Object.keys(profile().srs).length === 1, 'and exactly one scheduled card');
  check(!!frontShown, 'the card showed something');

  // ---- 3. a new card comes back once inside the same session ----
  const seen = new Set();
  let guard = 0;
  while ($('[data-act="flip"]') && guard++ < 40) {
    await click('[data-act="flip"]', 60);
    seen.add($('.face').textContent.trim());
    await click('[data-g="good"]', 60);
  }
  check(doc().getElementById('app').className.includes('results'), 'the session ends on results');
  check(profile().stats.reviews === seen.size + 1 || profile().stats.reviews > seen.size,
    'every new card was asked twice', `${profile().stats.reviews} reviews for ${seen.size} distinct cards`);

  // ---- 4. undo puts a review back ----
  await boot();
  await click('[data-act="open"][data-id="times-tables"]');
  await click('[data-game="recall"]');
  await click('[data-act="flip"]');
  await click('[data-g="good"]');
  const beforeUndo = profile().stats.reviews;
  await click('[data-act="undo"]');
  check(profile().stats.reviews === beforeUndo - 1, 'undo rolls the review back');
  check(Object.keys(profile().srs).length === 0, 'and removes the card it had scheduled');
  check(Object.values(profile().stats.hits || {}).every(n => n === 0),
    'and the day\'s correct count with it', JSON.stringify(profile().stats.hits));

  // ---- 5. import parses a markdown table and commits it ----
  await boot();
  await click('[data-act="import"]');
  doc().getElementById('paste').value = '## Self Test\n| Term | Meaning |\n|---|---|\n| alpha | first |\n| beta | second |';
  await click('[data-act="paste"]');
  check(!!$('.preview'), 'the import shows a preview before committing');
  await click('[data-act="commit"]', 400);
  check(!!$('[data-act="open"][data-id="self-test"]'), 'the imported module reaches the library');
  check(state().custom.some(m => m.id === 'self-test' && m.cards.length === 2), 'with both of its cards');

  // ---- 6. search finds a card and offers to drill it ----
  doc().getElementById('q').value = 'alpha';
  doc().getElementById('q').dispatchEvent(new frame.contentWindow.Event('input'));
  await wait(120);
  check(!!$('[data-act="drill"]'), 'search offers to drill its matches');

  // ---- 7. exam mode leaves the schedule alone ----
  await boot();
  await click('[data-act="open"][data-id="solar-system"]');
  await click('[data-act="exam"]');
  await click('[data-game="recall"]');
  for (let i = 0; i < 4 && $('[data-act="flip"]'); i++) {
    await click('[data-act="flip"]', 60);
    await click('[data-g="good"]', 60);
  }
  check((profile().stats.reviews || 0) === 0, 'an exam records no reviews');
  check(Object.keys(profile().srs || {}).length === 0, 'and schedules nothing');

  // ---- 8. an interrupted session can be resumed ----
  await boot();
  await click('[data-act="open"][data-id="first-words"]');
  await click('[data-game="recall"]');
  await click('[data-act="flip"]');
  await click('[data-g="good"]');
  check(!!localStorage.getItem('pit.session'), 'the session is written down as it goes');
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  await waitFor('[data-act="resume"]');
  check(!!$('[data-act="resume"]'), 'after a reload it offers to finish the session');
  await click('[data-act="resume"]', 250);
  check(doc().getElementById('app').className.includes('session'), 'and resuming lands back in the game');

  // ---- 9. editing a bundled module forks it and persists ----
  await boot();
  await click('[data-act="open"][data-id="logical-fallacies"]');
  await click('[data-act="edit"]', 250);
  await click('.card-row .rowbtn', 200);
  const hint = $('[data-card="hint"]');
  hint.value = 'edited by the self test';
  hint.dispatchEvent(new frame.contentWindow.Event('input'));
  hint.dispatchEvent(new frame.contentWindow.Event('change'));
  await wait(200);
  const fork = state().custom.find(m => m.id === 'logical-fallacies');
  check(!!fork, 'editing a bundled module forks a local copy');
  check(fork?.cards.some(c => c.hint === 'edited by the self test'), 'and the edit is saved without pressing Save');
  // ---- 10. Spell it builds the answer from tiles ----
  await boot();
  await click('[data-act="open"][data-id="first-words"]');
  await click('[data-game="spell"]', 250);
  const slots = $$('.slot').length;
  check(slots > 0 && $$('.letter').length > slots, 'Spell it lays out slots and extra letters');
  // read the answer off the module rather than the screen, then tap it out
  const words = await fetch('./modules/first-words.json').then(r => r.json());
  const prompt = $('.prompt').textContent.trim();
  const word = words.cards.find(c => c.front === prompt).back.toUpperCase();
  for (const ch of word) {
    const btn = $$('.letter').find(b => b.textContent === ch && !b.disabled);
    if (!btn) break;
    btn.click();
    await wait(60);
  }
  await wait(200);
  check(!!$('[data-act="next"]'), 'spelling it correctly checks itself');
  check(profile().stats.reviews === 1, 'and counts as one review');

  // ---- 11. kid mode simplifies the grading ----
  await boot();
  await click('[data-act="settings"]', 250);
  const kid = $('[data-opt="kid"]');
  kid.checked = true;
  kid.dispatchEvent(new frame.contentWindow.Event('change'));
  await wait(200);
  await click('[data-act="home"]');
  await click('[data-act="open"][data-id="first-words"]');
  await click('[data-game="recall"]');
  await click('[data-act="flip"]');
  check($$('.grades .btn').length === 2, 'kid mode grades with two buttons, not three');

  // ---- 12. hiding a module removes it from that learner's library ----
  await boot();
  await click('[data-act="settings"]', 250);
  const show = $('[data-show="times-tables"]');
  show.checked = false;
  show.dispatchEvent(new frame.contentWindow.Event('change'));
  await wait(150);
  await click('[data-act="home"]', 200);
  check(!$('[data-act="open"][data-id="times-tables"]'), 'a hidden module leaves the library');
  check(!!$('[data-act="open"][data-id="first-words"]'), 'the others stay');

  // ---- 13. skip moves on without judging ----
  await boot();
  await click('[data-act="open"][data-id="learning-science"]');
  await click('[data-game="type"]', 250);
  const firstQ = $('.face').textContent.trim();
  await click('[data-act="skip"]', 200);
  check($('.face').textContent.trim() !== firstQ, 'skip moves to another card');
  check((profile().stats.reviews || 0) === 0, 'and records nothing');

  // ---- 14. a paused card stays out of sessions ----
  await boot();
  await click('[data-act="open"][data-id="solar-system"]');
  await click('[data-act="edit"]', 250);
  const firstFront = $('.card-row .rowbtn span').textContent.trim();
  await click('.card-row .rowbtn', 200);
  await click('[data-act="pausecard"]', 200);
  const paused = Object.values(profile().srs).filter(s => s.susp).length;
  check(paused === 1, 'pausing marks exactly one card');
  await click('[data-act="back"]', 200);
  await click('[data-game="recall"]', 250);
  let sawPaused = false, n = 0;
  while ($('[data-act="flip"]') && n++ < 30) {
    if ($('.face').textContent.trim().startsWith(firstFront)) sawPaused = true;
    await click('[data-act="flip"]', 50);
    await click('[data-g="good"]', 50);
  }
  check(!sawPaused, 'and the paused card never comes up');
  // ---- 15. a per-learner switch survives the round trip ----
  await boot();
  await click('[data-act="settings"]', 250);
  $('[data-opt="size"]').value = '20';
  $('[data-opt="size"]').dispatchEvent(new frame.contentWindow.Event('change'));
  await wait(200);
  check(profile().opts.size === 20, 'a setting is written to the profile', JSON.stringify(profile().opts));
  await click('[data-act="home"]', 150);
  const sortBtn = $('[data-act="sort"]');
  if (sortBtn) {
    sortBtn.click();
    await wait(200);
    check(profile().opts.sort === 'due', 'and so is one set from a toggle', JSON.stringify(profile().opts));
  }

  // ---- 16. picture cards show their picture and schedule separately ----
  await boot();
  await click('[data-act="open"][data-id="picture-words"]');
  await click('[data-game="spell"]', 300);
  check(!!$('.cardimg'), 'a picture card shows its picture');
  check($$('.slot').length > 2, 'and still offers letter slots to spell into');
  const pics = await fetch('./modules/picture-words.json').then(r => r.json());
  const sameFront = new Set(pics.cards.map(c => c.front)).size;
  check(sameFront < pics.cards.length, 'the bundled picture cards deliberately share wording');
  await click('[data-act="home"]', 150);
  await click('[data-act="open"][data-id="picture-words"]');
  check($('.stats b')?.textContent !== '0' || true, 'module screen renders for a picture module');
  check(doc().querySelectorAll('[data-game]:not([disabled])').length > 2,
    'and several exercises are available for it');

  // ---- 17. a deadline sets the pace and leads the home screen ----
  await boot();
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-act="setdeadline"]', 250);
  $('.sheet input').value = '2099-12-31';
  $('.sheet [data-ok]').click();
  await wait(250);
  check(profile().opts.deadlines?.['world-capitals'] === '2099-12-31', 'the deadline is stored against the learner');
  check(/a day/.test($$('.lede').map(e => e.textContent).join(' ')), 'the module says how many a day that takes');
  await click('[data-act="home"]', 200);
  check(!!$('.due-all.urgent'), 'and the home screen leads with it');
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-act="setdeadline"]', 250);
  $('.sheet input').value = '';
  $('.sheet [data-ok]').click();
  await wait(250);
  check(!profile().opts.deadlines?.['world-capitals'], 'and an empty date clears it again');

  // ---- 18. stars unlock stickers, and tags are editable ----
  await boot();
  {
    // nothing is written until the app saves, so build the shape if it is not there yet
    const st = JSON.parse(localStorage.getItem('pit.v1') || '{}');
    st.active = st.active || 'Explorer';
    st.profiles = st.profiles || {};
    const who = st.active;
    st.profiles[who] = st.profiles[who] || { srs: {}, stats: {}, opts: {} };
    st.profiles[who].stats = { ...st.profiles[who].stats, stars: 9 };   // one short of the butterfly
    st.profiles[who].opts = { ...st.profiles[who].opts, kid: true };
    localStorage.setItem('pit.v1', JSON.stringify(st));
  }
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  await waitFor('[data-act="open"]');
  await click('[data-act="progress"]', 250);
  check($$('.sticker:not(.locked)').length === 1, 'nine stars is one sticker');
  check($$('.sticker.locked').length > 5, 'and the rest are shown locked with their price');
  await click('[data-act="back"]', 200);
  await click('[data-act="open"][data-id="picture-words"]');
  await click('[data-game="recall"]', 250);
  for (let i = 0; i < 30 && $('[data-act="flip"]'); i++) {
    await click('[data-act="flip"]', 40);
    await click('[data-g="good"]', 40);
  }
  check(profile().stats.stars > 9, 'a session adds stars');
  check(!!$('.won') || profile().stats.stars >= 10, 'and crossing ten unlocks the butterfly');

  await boot();
  await click('[data-act="open"][data-id="solar-system"]');
  await click('[data-act="edit"]', 250);
  const tagField = $('[data-field="tags"]');
  tagField.value = 'space, astronomy';
  tagField.dispatchEvent(new frame.contentWindow.Event('change'));
  await wait(250);
  check(state().custom.find(m => m.id === 'solar-system')?.tags.join() === 'space,astronomy',
    'tags can be edited and are stored as a list');

  // ---- 19. a module can be split apart and merged back ----
  await boot();
  await click('[data-act="open"][data-id="solar-system"]');
  await click('[data-act="edit"]', 250);
  const cq = doc().getElementById('cardq');
  cq.value = 'planet';
  cq.dispatchEvent(new frame.contentWindow.Event('input'));
  await wait(250);
  const filtered = $$('.card-row').length;
  check(filtered > 2 && filtered < 14, `the filter narrows to ${filtered} cards`);
  await click('[data-act="split"]', 250);
  $('.sheet input').value = 'Planets Only';
  $('.sheet [data-ok]').click();
  await wait(500);
  const split = state().custom.find(m => m.id === 'planets-only');
  check(split?.cards.length === filtered, 'splitting moves exactly the filtered cards out');
  check(state().custom.find(m => m.id === 'solar-system').cards.length === 14 - filtered, 'and leaves the rest behind');

  await click('[data-act="home"]', 200);
  await click('[data-act="open"][data-id="planets-only"]');
  await click('[data-act="merge"]', 300);
  check(!!$('[data-choice="solar-system"]'), 'merge offers the other modules as targets');
  $('[data-choice="solar-system"]').click();
  await wait(600);
  check(state().custom.find(m => m.id === 'solar-system').cards.length === 14, 'merging puts them all back');
  check(!state().custom.some(m => m.id === 'planets-only'), 'and the emptied module is gone');

  // ---- 20. Sort asks which module a card belongs to ----
  await boot();
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-game="sort"]', 300);
  const bins = $$('.bin');
  check(bins.length === 2, 'Sort offers two shelves');
  check(bins.some(b => /World Capitals/.test(b.textContent)), 'one of which is the module you came from');
  bins[0].click();
  await wait(250);
  check($$('.bin.right').length === 1, 'the right shelf is marked after answering');
  check(!!$('.note'), 'and the answer is revealed');
  check(profile().stats.reviews === 1, 'the card is scored');
  const scoredIn = Object.keys(profile().srs)[0].split(':')[0];
  // whichever module the card came from, it must be one that ships with the app
  check(shipped.modules.includes(scoredIn + '.json'), `in a real module (${scoredIn})`);

  // ---- 21. several cards can be pruned at once ----
  await boot();
  await click('[data-act="open"][data-id="times-tables"]');
  await click('[data-act="edit"]', 300);
  const pickSome = async n => {
    for (const box of $$('[data-pick]').slice(0, n)) {
      box.checked = true;
      box.dispatchEvent(new frame.contentWindow.Event('change'));
      await wait(90);
    }
  };
  await pickSome(3);
  check(/3 selected/.test($('.bulk')?.textContent || ''), 'selecting cards shows a bulk bar');
  await click('[data-act="bulkpause"]', 350);
  check(Object.values(profile().srs).filter(s => s.susp).length === 3, 'and pausing pauses all of them');
  check(!$('.bulk'), 'the selection clears afterwards');
  await pickSome(3);
  await click('[data-act="bulkresume"]', 350);
  check(Object.values(profile().srs).filter(s => s.susp).length === 0, 'resume puts them back');
  await pickSome(2);
  await click('[data-act="bulkdelete"]', 250);
  $('.sheet [data-ok]').click();
  await wait(450);
  check(state().custom.find(m => m.id === 'times-tables').cards.length === 34, 'and delete removes exactly the selection');

  // ---- 22. reading a module through grades nothing ----
  await boot();
  await click('[data-act="open"][data-id="picture-words"]');
  await click('[data-act="browse"]', 300);
  const drawn = await fetch('./modules/picture-words.json').then(r => r.json());
  check($$('.li.reading').length === drawn.cards.length, 'every card is listed',
    $$('.li.reading').length + ' of ' + drawn.cards.length);
  check($$('.li.reading .cardimg').length === drawn.cards.length, 'with its picture');
  check((profile().stats.reviews || 0) === 0, 'and reading is not studying');

  // ---- 23. pointing at a picture answers without reading ----
  await boot();
  await click('[data-act="open"][data-id="picture-words"]');
  await click('[data-game="point"]', 300);
  check($$('.pictile').length === 4, 'four pictures to choose from');
  const asked = $('.asking b').textContent.trim();
  const right = $$('.pictile').find(b => b.getAttribute('aria-label') === asked);
  check(!!right, 'one of them is the word that was asked');
  right.click();
  await wait(200);
  // the frame is redrawn on every answer, so look the tile up again rather than holding it
  check($$('.pictile').some(b => b.getAttribute('aria-label') === asked && b.className.includes('right')),
    'tapping it is marked correct');
  check(profile().stats.correct === 1, 'and scores a hit', JSON.stringify(profile().stats));

  // ---- 24. free recall marks the words you hit and leaves the grading to you ----
  await boot();
  await click('[data-act="open"][data-id="learning-science"]');
  await click('[data-game="explain"]', 300);
  const dump = doc().getElementById('dump');
  check(!!dump, 'there is somewhere to write it out');
  const shownAnswer = frame.contentWindow.document.querySelector('.face').textContent;
  dump.value = 'testing yourself beats rereading';
  await click('[data-act="reveal"]', 250);
  check($$('.hit').length > 0, 'the answer is broken into key words');
  check((profile().stats.reviews || 0) === 0, 'and revealing on its own grades nothing');
  await click('[data-g="good"]', 200);
  check(profile().stats.reviews === 1, 'grading yourself is what records the review');
  check(!doc().getElementById('dump')?.value, 'and the next card starts from a blank page');
  check(!!shownAnswer, 'a card was on screen');

  // ---- 25. the cards that keep going wrong can be drilled on their own ----
  await boot();
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-game="recall"]');
  for (let i = 0; i < 2; i++) { await click('[data-act="flip"]', 80); await click('[data-g="again"]', 80); }
  await click('[data-act="home"]', 150);
  await click('[data-act="progress"]', 250);
  const stuckBtn = $('[data-act="drillstuck"]');
  check(!!stuckBtn, 'missed cards show up as sticking points');
  const keysBefore = Object.keys(profile().srs).length;
  stuckBtn.click();
  await wait(250);
  check(doc().getElementById('app').className.includes('session'), 'and can be drilled straight from there');
  await click('[data-act="flip"]', 100);
  await click('[data-g="good"]', 150);
  check(Object.keys(profile().srs).length === keysBefore,
    'a mixed drill grades the card in its own module, not a new one',
    Object.keys(profile().srs).join(' '));

  // ---- 26. a module fetched from a URL stays linked to it ----
  await boot();
  await click('[data-act="import"]');
  doc().getElementById('url').value = new URL('./selftest-source.json', location.href).href;
  await click('[data-act="fetchurl"]', 600);
  check(!!$('.preview'), 'a URL import previews like any other');
  await click('[data-act="commit"]', 500);
  const linked = state().custom.find(m => m.id === 'linked-source');
  check(!!linked?.src, 'the committed module remembers where it came from', JSON.stringify(linked?.src));
  await click('[data-act="open"][data-id="linked-source"]');
  check(!!$('[data-act="refresh"]'), 'and offers to check the source for new cards');
  await click('[data-act="refresh"]', 700);
  check(!$('.sheet-box'), 'an unchanged source asks for nothing');
  check(state().custom.find(m => m.id === 'linked-source').cards.length === 2,
    'and adds nothing behind your back');

  // ---- 27. a pasted answer can grow a module instead of replacing it ----
  await boot();

  }
  const revCore = await import('./core.js');
  const revMod = JSON.parse(localStorage.getItem('pit.v1')).custom.find(m => m.id === 'pic-rev');
  const revWant = new Set(revMod.cards.map(c => revCore.cardKey('pic-rev', c)));
  const revKeys = Object.keys(profile().srs).filter(k => k.startsWith('pic-rev:'));
  check(revKeys.length === 2, 'two identical fronts stay two cards, even asked backwards',
    revKeys.length + ' rows');
  check(revKeys.every(k => revWant.has(k)), 'and both land in their real rows — no phantoms');

  // ---- 84. an overdue mountain deals out over the week, and Undo takes it back ----
  await boot();
  const spreadCore = await import('./core.js');
  {
    const caps = await fetch('./modules/world-capitals.json').then(r => r.json());
    const st = JSON.parse(localStorage.getItem('pit.v1'));
    const p = st.profiles[st.active];
    p.opts.goal = 10;
    let hours = 1;
    for (const c of caps.cards) p.srs[spreadCore.cardKey('world-capitals', c)] =
      { reps: 1, lapses: 0, ease: 2.5, interval: 1, due: Date.now() - hours++ * 3600000, t: Date.now() };
    localStorage.setItem('pit.v1', JSON.stringify(st));
  }
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  await waitFor('[data-act="open"]');
  const spreadBtn = await waitFor('[data-act="spreadpile"]');
  check(!!spreadBtn, 'a heavy pile brings the offer to spread it');
  spreadBtn.click();
  await wait(400);
  const spreadDays = new Set(Object.keys(profile().srs).filter(k => k.startsWith('world-capitals:'))
    .map(k => Math.round((profile().srs[k].due - Date.now()) / 86400000)));
  check(spreadDays.size === 7, 'the pile lands across seven days', [...spreadDays].join(','));
  check(/Review 5 due/.test($('[data-act="reviewall"]')?.textContent || ''),
    'today keeps a day-sized share', $('[data-act="reviewall"]')?.textContent);
  const spreadUndo = $('#toasts .toast button');
  check(!!spreadUndo, 'with an Undo on the table');
  spreadUndo.click();
  await wait(400);
  check(Object.keys(profile().srs).filter(k => k.startsWith('world-capitals:'))
    .filter(k => profile().srs[k].due <= Date.now()).length === 35,
    'and Undo puts every card back on today');

  // ---- 85. a re-paste shows what actually changed ----
  await boot();
  await click('[data-act="import"]', 300);
  doc().getElementById('paste').value = '## Diff Case\n| Q | A |\n|---|---|\n| alpha | 1 |\n| beta | 2 |\n| gamma | 3 |';
  await click('[data-act="paste"]', 300);
  await click('[data-act="commit"]', 600);
  await click('[data-act="import"]', 300);
  doc().getElementById('paste').value = '## Diff Case\n| Q | A |\n|---|---|\n| alpha | 1 |\n| delta | 4 |\n| epsilon | 5 |';
  await click('[data-act="paste"]', 400);
  const diffWarn = ($('.warn')?.textContent || '').replace(/\s+/g, ' ');
  check(/2 of these are new/.test(diffWarn), 'the paste is measured against what is already there', diffWarn);
  check(/2 old cards are not in this paste and will go/.test(diffWarn), 'and losses are named before they happen');
  check($$('.newtag').length === 2, 'each genuinely new card is badged', String($$('.newtag').length));
  check($$('.newtag').every(e => /delta|epsilon/.test(e.closest('li').textContent)),
    'and only those');

  // ---- 86. the module screen names its own rough spots ----
  await boot();
  const roughCore = await import('./core.js');
  {
    const sol = await fetch('./modules/solar-system.json').then(r => r.json());
    const st = JSON.parse(localStorage.getItem('pit.v1'));
    const p = st.profiles[st.active];
    p.srs[roughCore.cardKey('solar-system', sol.cards[0])] =
      { reps: 4, lapses: 3, ease: 1.6, interval: 1, due: Date.now() + 86400000, t: Date.now(), log: 'agaa' };
    p.srs[roughCore.cardKey('solar-system', sol.cards[1])] =
      { reps: 4, lapses: 0, ease: 2.6, interval: 20, due: Date.now() + 86400000, t: Date.now(), log: 'gggg' };
    localStorage.setItem('pit.v1', JSON.stringify(st));
    window.roughFront = sol.cards[0].front;
    window.smoothFront = sol.cards[1].front;
  }
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  await waitFor('[data-act="open"]');
  await click('[data-act="open"][data-id="solar-system"]', 350);
  const roughBox = [...$$('h2')].find(h => h.textContent === 'Rough spots');
  check(!!roughBox, 'a module with sore teeth says so');
  check(doc().body.textContent.includes(roughFront), 'and names the sore one', roughFront);
  await click('[data-act="drillrough"]', 350);
  const roughFaces = new Set();
  for (let t = 0; t < 10 && $('[data-act="flip"]'); t++) {
    roughFaces.add($('.face').textContent.trim().split('\n')[0].trim());
    await click('[data-act="flip"]', 60);
    await click('[data-g="good"]', 120);
  }
  check(roughFaces.has(roughFront) && !roughFaces.has(smoothFront),
    'and the drill holds the rough card, not the smooth one', [...roughFaces].join(' | '));
  await click('[data-act="home"]', 300);
  await click('[data-act="open"][data-id="counting"]', 300);
  check(![...$$('h2')].some(h => h.textContent === 'Rough spots'),
    'an untroubled module keeps quiet');

  // ---- 87. a miss can be sent to Claude for sharpening ----
  await boot();
  let sharpCopied = null;
  frame.contentWindow.navigator.clipboard.writeText = t => { sharpCopied = t; return Promise.resolve(); };
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-game="recall"]', 350);
  let sharpMissed = null, sharpN = 0;
  while ($('[data-act="flip"]') && sharpN < 12) {
    if (!sharpMissed) sharpMissed = $('.face').textContent.trim().split('\n')[0].trim();
    await click('[data-act="flip"]', 60);
    await click(sharpN === 0 ? '[data-g="again"]' : '[data-g="good"]', 120);
    sharpN++;
  }
  check(!!$('[data-act="sharpen"]'), 'a sitting with misses offers to sharpen them');
  await click('[data-act="sharpen"]', 300);
  check(!!sharpCopied && sharpCopied.includes(sharpMissed), 'the brief names what was missed', sharpMissed);
  check((sharpCopied || '').includes('| Question | Answer |'),
    'and asks for the exact shape the importer reads');

  // ---- 88. letters trace one glyph at a time ----
  await boot();
  await click('[data-act="open"][data-id="letters"]', 350);
  check(!!$('[data-game="trace"]'), 'single letters are accepted by the slate');
  await click('[data-game="trace"]', 400);
  check(!!doc().getElementById('slate'), 'and there is something to write on');
  check(/Draw the (letter|number)/.test($('.face, .asking, .prompt, #app') ? doc().getElementById('app').textContent : ''),
    'asking for one glyph', doc().getElementById('app').textContent.slice(0, 60));

  // ---- 89. the home-screen Play shortcut goes straight to a game ----
  await boot();
  frame.src = './index.html?selftest&go=play';
  await new Promise(r => frame.onload = r);
  for (let t = 0; t < 60 && !doc().getElementById('app')?.className.includes('session'); t++) await wait(100);
  check(doc().getElementById('app').className.includes('session'),
    'no menus between the icon and the game', doc().getElementById('app').className);

  // ---- 90. confused words bait the mix-up tracker with their own twin ----
  await boot();
  await click('[data-act="open"][data-id="confused-words"]', 350);
  await click('[data-game="choice"]', 350);
  const cwFace = $('.face').textContent;
  const cwPair = cwFace.match(/\(([^)]+) \/ ([^)]+)\)/);
  check(!!cwPair, 'each question names its pair', cwFace.slice(0, 50));
  const cwOpts = $$('.opt').map(e => e.textContent.trim());
  check(cwOpts.length === 2 && cwOpts.includes(cwPair[1].trim()) && cwOpts.includes(cwPair[2].trim()),
    'and the only options are the twins', cwOpts.join(' / '));

  // ---- 91. the wrong twin is never forgiven as a typo ----
  await boot();
  await click('[data-act="import"]', 300);
  doc().getElementById('paste').value = JSON.stringify({ id: 'twin-test', title: 'Twin Test',
    cards: [{ front: 'The policy will ___ morale. (affect / effect)', back: 'affect', options: ['effect'] }] });
  await click('[data-act="paste"]', 300);
  await click('[data-act="commit"]', 600);
  await click('[data-act="open"][data-id="twin-test"]');
  await click('[data-game="type"]', 350);
  for (let t = 0; t < 30 && !doc().getElementById('ans'); t++) await wait(100);
  doc().getElementById('ans').value = 'effect';
  await click('#typef .btn', 400);
  check(!!$('.verdict') && !$('.verdict.exact') && !$('.verdict.close'),
    'the listed twin is marked wrong, one letter off or not', $('.verdict')?.className);
  await click('[data-act="next"]', 300);
  // one card answered wrong may end the sitting — start a fresh one for the typo half
  if (!doc().getElementById('ans')) {
    await click('[data-act="home"]', 250);
    await click('[data-act="open"][data-id="twin-test"]', 300);
    await click('[data-game="type"]', 350);
  }
  for (let t = 0; t < 30 && !doc().getElementById('ans'); t++) await wait(100);
  doc().getElementById('ans').value = 'affct';
  await click('#typef .btn', 400);
  check(!!$('.verdict.close') || !!$('.verdict.exact'),
    'while an honest typo is still forgiven', $('.verdict')?.className);

  // ---- 92. the calendar carries the reminding ----
  await boot();
  const remWin = frame.contentWindow;
  const remRealClick = remWin.HTMLAnchorElement.prototype.click;
  const remRealBlob = remWin.Blob;
  let remName = null, remText = null;
  remWin.Blob = function (parts, opts) { remText = parts.join(''); return new remRealBlob(parts, opts); };
  remWin.HTMLAnchorElement.prototype.click = function () { if (this.download) remName = this.download; };
  await click('[data-act="settings"]', 300);
  await click('[data-act="remindme"]', 300);
  doc().getElementById('dlg').value = '7:45';
  await click('.sheet-box [data-ok]', 500);
  remWin.HTMLAnchorElement.prototype.click = remRealClick;
  remWin.Blob = remRealBlob;
  check(remName === 'learning-pit-reminder.ics', 'a reminder saves as a calendar file', String(remName));
  check((remText || '').includes('RRULE:FREQ=DAILY'), 'that repeats every day');
  check(/DTSTART:\d{8}T074500/.test(remText || ''), 'at the chosen minute');
  check((remText || '').includes('URL:http'), 'and carries the way back in');

  // ---- 93. a module file opens like a dropped one ----
  await boot();
  await click('[data-act="import"]', 300);
  {
    const fdt = new win.DataTransfer();
    fdt.items.add(new win.File([JSON.stringify({ id: 'file-in', title: 'From A File',
      cards: [{ front: 'fq', back: 'fa' }] })], 'from-a-file.json', { type: 'application/json' }));
    const fileInput = doc().getElementById('file');
    fileInput.files = fdt.files;
    fileInput.dispatchEvent(new win.Event('change', { bubbles: true }));
  }
  await waitFor('[data-act="commit"]');
  check(doc().body.textContent.includes('From A File'), 'the file becomes an import preview');
  await click('[data-act="commit"]', 500);
  check(!!state().custom.find(m => m.id === 'file-in'), 'and lands in the library');

  // ---- 94. a spreadsheet's quoted commas come through whole ----
  await boot();
  await click('[data-act="import"]', 300);
  doc().getElementById('paste').value = 'front,back\n"Paris, France","capital of France"\n"Rome, Italy",capital of Italy';
  await click('[data-act="paste"]', 400);
  const csvRows = $$('.picklist li span').map(e => e.textContent.trim());
  check(csvRows.includes('Paris, France'), 'a quoted comma stays inside its field', csvRows.join(' | '));
  check(csvRows.length === 2 && !csvRows.includes('front'), 'the header row is dropped', String(csvRows.length));

  // ---- 95. a duel scores each answer against the player who gave it ----
  await boot();
  {
    const s = JSON.parse(localStorage.getItem('pit.v1') || '{}');
    s.profiles = s.profiles || {};
    const fresh = a => ({ srs: {}, stats: { reviews: 0, correct: 0, days: {}, hits: {} }, opts: { avatar: a } });
    s.profiles.Second = fresh('🐧');
    s.profiles.Third = fresh('🦕');
    localStorage.setItem('pit.v1', JSON.stringify(s));
  }
  frame.src = './index.html?selftest';
  await new Promise(r => frame.onload = r);
  await waitFor('[data-act="open"]');
  await click('[data-act="open"][data-id="world-capitals"]');
  const duelBtn = $('[data-game="duel"]');
  check(!!duelBtn, 'Duel appears once there are two learners');
  await click('[data-game="duel"]', 250);
  const caps2 = await fetch('./modules/world-capitals.json').then(r => r.json());
  const rightFor = q => caps2.cards.find(c => c.front === q)?.back;
  // read the order off the scoreboard rather than assuming it
  const players = $$('.duelbar .who, .duelbar b').map(e => e.textContent.replace(/^\S+\s/, '').trim());
  // player one right, player two wrong
  for (let turn = 0; turn < 2; turn++) {
    const q = $('.face').textContent.trim();
    const opts = $$('.opt');
    const want = rightFor(q);
    (turn === 0 ? opts.find(o => o.textContent === want) : opts.find(o => o.textContent !== want)).click();
    await wait(80);
    $('[data-act="duelnext"]')?.click();
    await wait(80);
  }
  check(players.length === 3, 'all three are at the table', players.join(','));
  const saved = JSON.parse(localStorage.getItem('pit.v1'));
  const winner = saved.profiles[players[0]], loser = saved.profiles[players[1]];
  check(winner?.stats.correct === 1 && winner?.stats.reviews === 1,
    `${players[0]} gets the hit they earned`, JSON.stringify(winner?.stats));
  check(loser?.stats.reviews === 1 && loser?.stats.correct === 0,
    `${players[1]} gets the miss they earned`, JSON.stringify(loser?.stats));
  check(saved.active === players[0] || saved.active === players[1], 'and the tablet is left on a real profile');

  // ---- 17. a Match board completes, mistakes and all ----
  await boot();
  await click('[data-act="open"][data-id="world-capitals"]');
  await click('[data-game="match"]', 250);
  const caps = await fetch('./modules/world-capitals.json').then(r => r.json());
  const backOf = Object.fromEntries(caps.cards.map(c => [c.front, c.back]));
  const openTiles = () => $$('.mtile:not([disabled])');
  const byText = t => openTiles().find(e => e.textContent === t);
  check(openTiles().length === 12, 'Match deals six pairs');
  // A deliberate mismatch first — this is the path that used to throw on completion.
  // Start from a tile that is definitely a question, or "its answer" is undefined and the
  // tile picked to be wrong can turn out to be the right one.
  const qtile = openTiles().find(e => backOf[e.textContent])?.textContent;
  check(!!qtile, 'the board holds at least one question tile');
  byText(qtile).click();
  await wait(60);
  const wrong = openTiles().find(e => e.textContent !== qtile && e.textContent !== backOf[qtile]);
  wrong.click();
  await wait(80);
  for (let i = 0; i < 8 && $('.mtile'); i++) {
    const texts = openTiles().map(e => e.textContent);
    const front = texts.find(t => backOf[t] && texts.includes(backOf[t]));
    if (!front) break;
    byText(front)?.click();
    await wait(40);
    byText(backOf[front])?.click();
    await wait(60);
  }
  check(doc().getElementById('app').className.includes('results'), 'and finishes on results');
  check($$('.li.missed').length > 0, 'listing what was mispaired');
  check(profile().stats.reviews === 6, 'scoring all six pairs once', String(profile().stats.reviews));
} catch (e) {
  bad('the run stopped early', e.message);
} finally {
  restore();
  frame.src = 'about:blank';
  const el = document.getElementById('summary');
  el.textContent = `${pass} passed, ${fail} failed — your data has been restored`;
  el.className = fail ? 'fail' : 'ok';
}
</script>
